
name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest --cov=src --cov-report=term-missing

      - name: Generar documentación con pdoc
        run: |
          python -m pdoc -o site \
            src/corporate_data.py \
            src/corporate_log.py \
            src/corporate_observer.py \
            src/corporate_proxy.py \
            src/observerclient.py \
            src/singletonclient.py \
            src/singletonproxyobserver.py

      - name: Guardar documentación descargable
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-pdoc
          path: site/
          if-no-files-found: error

      - name: Preparar artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
